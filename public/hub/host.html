<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/hub/css/hub.css">
<link rel="stylesheet" href="/hub/css/menu.css">
<link rel="stylesheet" href="/hub/css/esmfamil.css">
<link rel="stylesheet" href="/hub/css/golpooch.css">

<!-- The host page stays in English whatever the TV language is (same as the
     music host page); only the game content itself is bilingual. -->
<body data-role="host" class="r-host">
  <div class="pin-gate" id="pin-gate" hidden>
    <h1>Game Night — Host</h1>
    <p>Enter the join PIN to access host controls.</p>
    <input type="text" id="pin-input" inputmode="numeric" autocomplete="off" placeholder="PIN">
    <button class="primary" id="pin-submit">Unlock</button>
    <p class="muted small" id="pin-error"></p>
  </div>

  <header class="host-top">
    <div class="host-brand"><img src="/logo.svg" alt="" width="30" height="30"> <span>Game Night</span> <span class="host-game" id="host-game-name"></span></div>
    <div class="host-actions">
      <button class="pill" id="back-hub" hidden>⬅ All games</button>
      <div class="seg" id="lang-seg"><button data-lang="en">EN</button><button data-lang="fa">فارسی</button></div>
      <div class="seg" id="theme-seg"><button data-theme="dark">🌙</button><button data-theme="light">☀️</button></div>
      <span class="pill conn" id="conn-pill">connecting…</span>
      <div class="pill gold" id="tvs-pill" hidden title="Only one TV screen plays the sound: the kiosk first, otherwise the one opened first. If you didn't mean to open another TV page (an old tv.html tab in your everyday Chrome, say), close it. On a muted TV screen, 'Play the sound here' moves the sound to it."></div>
    </div>
  </header>
  <main id="game-root" class="game-root host-root"></main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/avatars.js"></script>
  <script src="/vendor/NoSleep.min.js"></script>
  <script src="/js/keepawake.js"></script>
  <script src="/hub/js/strings.js"></script>
  <script src="/hub/js/games-meta.js"></script>
  <script src="/hub/js/core.js"></script>
  <script src="/hub/js/ui.js"></script>
  <script src="/hub/js/menu.js"></script>
  <script src="/hub/js/esmfamil.js"></script>
  <script src="/hub/js/golpooch.js"></script>
  <script src="/hub/js/pantomime.js"></script>
  <script src="/hub/js/mostlikely.js"></script>
  <script src="/hub/js/mafia.js"></script>
  <script src="/hub/js/spy.js"></script>
  <script src="/hub/js/draw.js"></script>
  <script src="/hub/js/truths.js"></script>
</body>
</html>
