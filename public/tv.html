<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Music — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&family=Vazirmatn:wght@500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/tv.css">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#16121f">
</head>
<body>
  <div class="tv-wrap">
    <header class="tv-header">
      <div class="brand"><img src="/logo.svg" alt="" class="logo-mark" width="32" height="32"> <span data-i18n="brand">Guess the Music</span></div>
    </header>

    <main class="stage" id="stage">
      <div class="video-box">
        <div id="yt-player"></div>
      </div>

      <div class="overlay" id="overlay">
        <!-- idle state -->
        <div class="panel" id="panel-idle">
          <!-- Category vote: swaps in for the whole idle panel (record,
               heading, and the join block below) while a vote is active —
               otherwise the record + "waiting for next round" heading eat
               the vertical space the vote list needs and it clips against
               the scoreboard footer. Same "swap the panel's own content
               into two variants" idea as idle-join-block already used. -->
          <div id="idle-waiting-block">
            <div class="record spin" aria-hidden="true"></div>
            <h1 data-i18n="waitingRound">Waiting for the next round…</h1>
            <div id="idle-join-block">
              <p data-i18n="scanToBuzz">Scan to grab a buzzer:</p>
              <img id="qr" alt="QR code to join as a player" width="180" height="180">
              <p class="muted" id="join-url"></p>
              <p class="muted" id="idle-hint"></p>
            </div>
          </div>

          <div id="category-vote-panel" hidden>
            <h2 id="vote-heading">🗳️ Vote for the next category!</h2>
            <div id="vote-options-tv" class="vote-options-tv"></div>
            <p class="muted small" id="vote-tv-status"></p>
          </div>
        </div>

        <!-- playing state -->
        <div class="panel" id="panel-playing" hidden>
          <div class="record spin" aria-hidden="true"></div>
          <h1 data-i18n="nowPlaying">Now playing…</h1>
          <p id="playing-subtext">Buzz in on your phone!</p>
          <p id="hint-text" hidden></p>
          <p id="snippet-hint" hidden></p>
        </div>

        <!-- wagering state (Daily Double: chosen player is deciding an amount) -->
        <div class="panel" id="panel-wagering" hidden>
          <div class="record" aria-hidden="true"></div>
          <h1>💰 Daily Double!</h1>
          <p id="wagering-subtext">—</p>
        </div>

        <!-- buzzed state -->
        <div class="panel" id="panel-buzzed" hidden>
          <div class="record" aria-hidden="true"></div>
          <h1 id="buzzed-name">—</h1>
          <p data-i18n="buzzedInFirst">buzzed in first!</p>
        </div>

        <!-- revealed state -->
        <div class="panel" id="panel-revealed" hidden>
          <p class="muted" data-i18n="theSongWas">The song was</p>
          <h1 id="reveal-title">—</h1>
          <p id="reveal-artist"></p>
        </div>

        <!-- results state -->
        <div class="panel" id="panel-results" hidden>
          <h1 data-i18n="finalScores">🏆 Final Scores</h1>
          <div id="results-list" class="results-list"></div>
          <div id="achievement-badges" class="achievement-badges" hidden></div>
          <div id="session-stats" class="session-stats" hidden></div>
        </div>
      </div>

      <!-- Also outside .overlay for the same reason as the hint below: needs
           to stay visible through 'playing' → 'buzzed' → 'revealed' as one
           continuous banner for that round, not tied to a single panel. -->
      <div class="mystery-banner" id="mystery-banner" hidden></div>
      <div class="wager-banner" id="wager-banner" hidden></div>

      <!-- Lives outside .overlay: the overlay fades out entirely during the
           'revealed' state to show the real video, but this hint needs to
           stay visible then. -->
      <p class="muted auto-advance-hint" id="auto-advance-hint"></p>

      <!-- Also outside .overlay, for the same reason: the big reveal panel
           fades away with the overlay almost immediately, which was too
           quick to actually read — this stays up for the whole 'revealed'
           state as a persistent caption. -->
      <div class="reveal-caption" id="reveal-caption" hidden>
        <span id="caption-title"></span><span id="caption-artist"></span>
      </div>

      <!-- Cartoon mascot companion (extraAnimations toggle — cosmetic
           only). Also outside .overlay: it needs to stay visible and keep
           reacting through every roundStatus, 'revealed' included. Built
           entirely from the same gradient recipe as .record (a face on the
           record, not a new asset), plus CSS-only eyes/mouth/arms that
           swap per data-expression instead of separate SVG art. -->
      <div class="mascot" id="mascot" data-expression="idle" hidden>
        <div class="mascot-arm mascot-arm-l"></div>
        <div class="mascot-arm mascot-arm-r"></div>
        <div class="mascot-head">
          <div class="mascot-face">
            <span class="mascot-eye mascot-eye-l"></span>
            <span class="mascot-eye mascot-eye-r"></span>
          </div>
          <span class="mascot-cheek mascot-cheek-l"></span>
          <span class="mascot-cheek mascot-cheek-r"></span>
          <span class="mascot-mouth"></span>
        </div>
        <div class="mascot-hat"></div>
      </div>

      <!-- Sits above everything else (even the mascot) while paused — the
           whole point of a pause is a clean, unambiguous break screen. -->
      <div class="paused-overlay" id="paused-overlay" hidden>
        <div class="record spin" aria-hidden="true"></div>
        <h1 data-i18n="gamePaused">Game paused — back in a moment!</h1>
      </div>
    </main>

    <footer class="scoreboard" id="scoreboard"></footer>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/avatars.js"></script>
  <script src="/js/tv.js"></script>
</body>
</html>
