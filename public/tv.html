<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Music — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Vazirmatn:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/tv.css">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0b0814">
</head>
<body>
  <!-- Slow-drifting color field behind everything (motion only under the
       extraAnimations toggle — see the .fx class in tv.css). Pure
       atmosphere: never over anything that needs reading. -->
  <div class="aurora" aria-hidden="true">
    <span class="aurora-blob b1"></span>
    <span class="aurora-blob b2"></span>
    <span class="aurora-blob b3"></span>
  </div>

  <div class="tv-wrap">
    <header class="tv-header">
      <div class="brand"><img src="/logo.svg" alt="" class="logo-mark" width="40" height="40"> <span data-i18n="brand">Guess the Music</span></div>
      <div class="header-chip" id="header-join-chip" hidden></div>
    </header>

    <main class="stage" id="stage" data-status="idle">
      <!-- Hidden (opacity 0, still playing audio) during every state except
           'revealed' — that's what keeps the title/artist burned into most
           music videos off screen while people are guessing. -->
      <div class="video-box">
        <div id="yt-player"></div>
      </div>

      <div class="overlay" id="overlay">
        <!-- Full-stage color flood + sunburst behind the buzzed panel, tinted
             to the buzzing player's own avatar color. -->
        <div class="buzz-takeover" id="buzz-takeover" aria-hidden="true">
          <div class="sunburst"></div>
        </div>

        <!-- idle state -->
        <div class="panel" id="panel-idle">
          <!-- Category vote swaps in for the whole idle lobby while a vote is
               active — the lobby block and the vote list don't both fit. -->
          <div id="idle-waiting-block" class="lobby">
            <div class="lobby-hero">
              <div class="record-stage record-stage-sm">
                <div class="viz-ring" aria-hidden="true"></div>
                <div class="record spin" aria-hidden="true"></div>
              </div>
              <h1 data-i18n="waitingRound">Waiting for the next round…</h1>
              <p class="muted" id="idle-hint"></p>
            </div>
            <div id="idle-join-block" class="join-card">
              <div class="qr-frame"><img id="qr" alt="QR code to join as a player" width="200" height="200"></div>
              <div class="join-text">
                <span class="eyebrow" data-i18n="joinEyebrow">Join the game</span>
                <p class="join-title" data-i18n="scanWithCamera">Scan with your phone camera</p>
                <p class="join-url" id="join-url" dir="ltr"></p>
                <p class="join-count" id="join-count" hidden></p>
              </div>
            </div>
          </div>

          <div id="category-vote-panel" class="vote-panel" hidden>
            <h2 id="vote-heading">🗳️ Vote for the next category!</h2>
            <div id="vote-options-tv" class="vote-options-tv"></div>
            <p class="muted" id="vote-tv-status"></p>
          </div>
        </div>

        <!-- playing state -->
        <div class="panel" id="panel-playing" hidden>
          <div class="record-stage">
            <div class="viz-ring" aria-hidden="true"></div>
            <svg class="timer-ring" id="timer-ring" viewBox="0 0 100 100" aria-hidden="true" hidden>
              <circle class="timer-track" cx="50" cy="50" r="47"></circle>
              <circle class="timer-progress" id="timer-progress" cx="50" cy="50" r="47" pathLength="100"></circle>
            </svg>
            <div class="record spin" aria-hidden="true"></div>
          </div>
          <h1 data-i18n="nowPlaying">Now playing…</h1>
          <p id="playing-subtext">Buzz in on your phone!</p>
          <p id="hint-text" hidden></p>
          <p id="snippet-hint" class="tag-chip" hidden></p>
        </div>

        <!-- wagering state (Daily Double: chosen player is deciding an amount) -->
        <div class="panel" id="panel-wagering" hidden>
          <h1 class="wager-title" data-i18n="dailyDouble">💰 Daily Double!</h1>
          <p id="wagering-subtext">—</p>
        </div>

        <!-- buzzed state -->
        <div class="panel" id="panel-buzzed" hidden>
          <div class="buzzed-avatar" id="buzzed-avatar"></div>
          <h1 id="buzzed-name">—</h1>
          <p class="buzzed-sub" data-i18n="buzzedInFirst">buzzed in first!</p>
          <p id="buzzed-verdict" class="verdict" hidden></p>
          <p id="buzzed-tease" hidden></p>
        </div>

        <!-- revealed state (fades with the overlay so the video shows; the
             persistent lower-third caption below carries the answer) -->
        <div class="panel" id="panel-revealed" hidden>
          <p class="muted" data-i18n="theSongWas">The song was</p>
          <h1 id="reveal-title">—</h1>
          <p id="reveal-artist"></p>
        </div>

        <!-- results state -->
        <div class="panel" id="panel-results" hidden>
          <span class="eyebrow" data-i18n="gameOverEyebrow">Game over</span>
          <h1 data-i18n="finalScores">🏆 Final Scores</h1>
          <div id="results-list" class="results"></div>
          <div class="results-extras">
            <div id="achievement-badges" class="achievement-badges" hidden></div>
            <div id="session-stats" class="session-stats" hidden></div>
          </div>
        </div>
      </div>

      <!-- Outside .overlay: these need to stay visible through
           'playing' → 'buzzed' → 'revealed' as one continuous banner, and
           .overlay fades out entirely during 'revealed'. -->
      <div class="corner-chip mystery-banner" id="mystery-banner" hidden></div>
      <div class="corner-chip wager-banner" id="wager-banner" hidden></div>

      <p class="auto-advance-hint" id="auto-advance-hint"></p>

      <!-- Broadcast-style lower third, up for the whole 'revealed' state. -->
      <div class="reveal-caption" id="reveal-caption" hidden>
        <span class="lt-bar" aria-hidden="true"></span>
        <div class="lt-body">
          <span class="lt-label" data-i18n="theSongWas">The song was</span>
          <span id="caption-title"></span>
          <span id="caption-artist"></span>
        </div>
      </div>

      <!-- Sits above everything else while paused — a clean, unambiguous
           break screen. -->
      <div class="paused-overlay" id="paused-overlay" hidden>
        <div class="pause-glyph" aria-hidden="true"><span></span><span></span></div>
        <h1 data-i18n="pausedTitle">Game paused — back in a moment!</h1>
      </div>
    </main>

    <footer class="scoreboard" id="scoreboard"></footer>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/avatars.js"></script>
  <script src="/js/tv.js"></script>
</body>
</html>
