<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess the Music — Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&family=Vazirmatn:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/player.css">
<link rel="manifest" href="/manifest-player.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#16121f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTM Buzzer">
</head>
<body>

  <!-- name entry (shown once, or when editing) -->
  <div class="name-screen" id="name-screen">
    <h1><img src="/logo.svg" alt="" class="logo-mark" width="44" height="44"> <span data-i18n="brand">Guess the Music</span></h1>
    <p data-i18n="whatShouldTvCallYou">What should the TV call you?</p>
    <input type="text" id="name-input" maxlength="24" placeholder="Your name" data-i18n-placeholder="yourNamePlaceholder" autocomplete="off">
    <button class="primary" id="name-submit" data-i18n="joinGame">Join the game</button>
  </div>

  <!-- main buzzer screen -->
  <div class="buzzer-screen" id="buzzer-screen" hidden>
    <header>
      <button class="pill" id="name-chip">Player</button>
      <div class="pill score-pill"><span id="my-score">0</span> <span data-i18n="pts">pts</span></div>
    </header>

    <main>
      <button id="buzz-btn" class="buzz-btn" disabled>
        <span id="buzz-label">Get ready…</span>
      </button>
      <p class="muted" id="status-text">Waiting for the host to start a round…</p>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
