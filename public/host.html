<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Music — Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/host.css">
<link rel="manifest" href="/manifest-host.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#16121f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTM Host">
</head>
<body>
  <div class="host-wrap">
    <header class="host-header">
      <h1><img src="/logo.svg" alt="" class="logo-mark" width="32" height="32"> Host Control</h1>
      <div class="header-right">
        <div class="lang-toggle" id="lang-toggle">
          <button data-lang="en" class="active">EN</button>
          <button data-lang="fa">فارسی</button>
        </div>
        <div class="pill" id="conn-pill">connecting…</div>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Current round</h2>
        <div class="pill" id="round-status-pill">idle</div>
        <span class="pill" id="playback-pill" hidden></span>
        <button id="open-youtube-fallback-btn" hidden>▶ Open on YouTube</button>
        <span class="pill" id="timer-pill" hidden></span>
        <span class="pill" id="auto-advance-pill" hidden></span>
        <span class="pill gold" id="mystery-pill" hidden></span>
        <div id="current-song-info" class="song-info muted">No round started.</div>
        <div id="buzz-order-list" class="buzz-list"></div>
        <div class="round-actions">
          <button id="reveal-btn" class="primary">Reveal answer</button>
          <button id="reset-buzzers-btn">Reset buzzers</button>
          <button id="close-round-btn">Close round</button>
          <button id="reveal-hint-btn" hidden>💡 Reveal a letter</button>
        </div>
        <p class="muted small shortcuts-hint">Keyboard: <kbd>Space</kbd> reveal · <kbd>R</kbd> reset buzzers · <kbd>C</kbd> close round</p>
        <div class="timer-row">
          <label for="auto-advance-input">Auto-advance after reveal (sec, 0 = off)</label>
          <input id="auto-advance-input" type="number" min="0" step="5" value="0">
        </div>
      </section>

      <section class="card" id="add-song-card">
        <h2>Add a song <span class="muted small" id="add-song-collapsed-hint" hidden>(collapsed while a round is live)</span></h2>
        <div id="add-song-body">
          <div class="stack">
            <input id="yt-input" type="url" placeholder="Paste a YouTube link or video ID">
            <input id="title-input" type="text" placeholder="Song title (only you see this)">
            <input id="artist-input" type="text" placeholder="Artist (optional)">
            <input id="category-input" type="text" placeholder="Category (optional, e.g. 80s)">
            <button id="add-song-btn" class="primary">Add to playlist</button>
            <p class="muted small" id="add-error"></p>
          </div>
          <div class="stack import-row">
            <input id="import-input" type="url" placeholder="Or paste a YouTube playlist link">
            <input id="import-category-input" type="text" placeholder="Tag these as… (optional)">
            <button id="import-btn">Import playlist</button>
            <p class="muted small" id="import-status"></p>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Playlist</h2>
        <div class="timer-row">
          <label for="timer-input">Round timer (sec, 0 = off)</label>
          <input id="timer-input" type="number" min="0" step="5" value="0">
        </div>
        <input id="playlist-search" type="text" class="playlist-search" placeholder="🔍 Search songs or artists…">
        <div id="category-filter" class="category-filter"></div>
        <div class="check-playlist-row">
          <button id="check-playlist-btn">🔍 Check for broken videos</button>
          <span class="muted small" id="check-playlist-status"></span>
        </div>
        <div id="broken-videos-list"></div>
        <div id="playlist-list" class="playlist"></div>
      </section>

      <section class="card">
        <h2>Scoreboard</h2>
        <div id="host-scoreboard" class="host-scoreboard"></div>
      </section>

      <section class="card" id="options-card">
        <h2>Game options</h2>
        <div class="options-list">
          <label class="option-row">
            <input type="checkbox" data-setting="stealMechanic">
            <span><strong>Steal mechanic</strong><br><span class="muted small">A wrong answer reopens buzzing to everyone — whoever steals it gets a bonus point.</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="extraAnimations">
            <span><strong>Extra animations</strong><br><span class="muted small">Bonus TV flourishes (steal banner, and more to come) on top of the base animations.</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="speedBonus">
            <span><strong>Speed bonus</strong><br><span class="muted small">Extra point for buzzing in within the first 3 seconds of a round.</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="pointValues">
            <span><strong>Point values per song</strong><br><span class="muted small">Set how much each song is worth instead of a flat point — edit the number next to each song in the playlist.</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="blindMode">
            <span><strong>Blind mode</strong><br><span class="muted small">Hide the scoreboard on TV until results, for suspense.</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="teamMode">
            <span><strong>Team mode</strong><br><span class="muted small">Players pick a team name when joining — buzzing locks the whole team, and awarding a point gives it to the whole team.</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="sessionStats">
            <span><strong>Session stats</strong><br><span class="muted small">Fastest buzz, biggest single round — all-time records shown on the results screen.</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="karaokeHint">
            <span><strong>Karaoke hint</strong><br><span class="muted small">Blank-per-letter title hint on TV, revealed one letter at a time by the host (no real lyrics — built from the song title only).</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="autoCategories">
            <span><strong>Auto-categories</strong><br><span class="muted small">Suggest a category per song from its artist's Spotify genre (needs SPOTIFY_CLIENT_ID/SECRET in .env — see README). Never overrides a category you typed yourself.</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="mysteryRound">
            <span><strong>Mystery modifier round</strong><br><span class="muted small">One random song each game gets a surprise twist — double points, no hints, or a blind score reveal — kept secret until that round actually starts.</span></span>
          </label>
          <label class="option-row">
            <input type="checkbox" data-setting="categoryVoting">
            <span><strong>Category voting</strong><br><span class="muted small">Let players vote on which category the next song comes from. Start a vote from the new card below while the round is idle.</span></span>
          </label>
        </div>
      </section>

      <section class="card" id="category-vote-card" hidden>
        <h2>Category vote</h2>
        <div id="vote-setup">
          <div id="vote-category-checks" class="options-list"></div>
          <div class="timer-row">
            <label for="vote-timer-input">Vote duration (sec, 0 = manual close)</label>
            <input id="vote-timer-input" type="number" min="0" step="5" value="0">
          </div>
          <button id="start-vote-btn" class="primary">🗳️ Start category vote</button>
          <p class="muted small" id="vote-status"></p>
        </div>
        <div id="vote-live" hidden>
          <span class="pill" id="vote-countdown" hidden></span>
          <div id="vote-tally" class="vote-tally"></div>
          <button id="close-vote-btn">Close vote</button>
        </div>
        <div id="vote-result" hidden>
          <p>🏆 Winner: <strong id="vote-winner-text"></strong></p>
          <button id="apply-vote-filter-btn">Filter playlist to this category</button>
        </div>
      </section>

      <section class="card join-card">
        <h2>Players join at</h2>
        <p class="muted" id="join-url"></p>
        <img id="qr" width="140" height="140" alt="QR code to join">
        <p class="muted small" id="mdns-url"></p>
        <div class="join-actions">
          <button id="show-results-btn" class="primary">🏆 Show results</button>
          <button id="reset-game-btn" class="danger">Reset entire game</button>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
